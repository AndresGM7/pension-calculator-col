[project]
name = "pension-calculator"
version = "0.1.0"
description = "Colombian pension calculator microservice — Ley 100/1993 + Ley 797/2003"
authors = [
    {name = "Andres Giraldo", email = "andresgiraldo1988@gmail.com"}
]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Full: TODO el stack (para dev local)
full = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "hiredis>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "weasyprint>=63.1",
    "jinja2>=3.1.4",
    "stripe>=11.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]
# PDF: solo WeasyPrint (para generar reportes)
pdf = ["weasyprint>=63.1", "jinja2>=3.1.4"]
# Payments: Stripe + crypto
payments = ["stripe>=11.0.0"]
# Observability: logging + metrics
observability = ["structlog>=24.4.0", "prometheus-client>=0.21.0"]
# DB: postgresql + migrations
db = ["sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30.0", "alembic>=1.14.0"]
# Cache: Redis
cache = ["redis>=5.2.0", "hiredis>=3.1.0"]
# Dev: testing + linting
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
